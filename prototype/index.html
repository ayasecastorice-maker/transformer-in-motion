function drawOverview(ctx, t) {

  const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${clamp(a)})`;
  const mix = (a, b, k) => a.map((v, i) => Math.round(v + (b[i] - v) * k));
  const reveal = ease(time / 0.92);

  const bottomY = 536 + Math.sin(time * 0.7 + 0.45) * 2.5 + (1 - reveal) * 23;
  const midY = 410 + Math.sin(time * 0.7 + 0.22) * 2.5 + (1 - reveal) * 18;

  function polygon(points, fill, stroke, lineWidth = 1) {
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    for (let i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
    ctx.closePath();
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lineWidth; ctx.stroke(); }
  }

  function roundedPolygon(points, radius) {
    const count = points.length;
    ctx.beginPath();
    for (let i = 0; i < count; i++) {
      const previous = points[(i + count - 1) % count];
      const point = points[i], next = points[(i + 1) % count];
      const beforeLength = Math.hypot(previous[0] - point[0], previous[1] - point[1]);
      const afterLength = Math.hypot(next[0] - point[0], next[1] - point[1]);
      const r = Math.min(radius, beforeLength * 0.25, afterLength * 0.25);
      const before = [point[0] + (previous[0] - point[0]) * r / beforeLength,
        point[1] + (previous[1] - point[1]) * r / beforeLength];
      const after = [point[0] + (next[0] - point[0]) * r / afterLength,
        point[1] + (next[1] - point[1]) * r / afterLength];
      if (i === 0) ctx.moveTo(before[0], before[1]);
      else ctx.lineTo(before[0], before[1]);
      ctx.quadraticCurveTo(point[0], point[1], after[0], after[1]);
    }
    ctx.closePath();
  }

  function label(text, x, y, color, size = 18, weight = 500, align = 'center') {
    ctx.save();

    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);

  }

  function line(points, color, width = 1) {
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);
    for (let i = 1; i < points.length; i++) ctx.lineTo(points[i][0], points[i][1]);
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
  }

  function glow(x, y, radius, color, alpha) {
    const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
    gradient.addColorStop(0, rgba(color, alpha));
    gradient.addColorStop(0.3, rgba(color, alpha * 0.34));

    ctx.fillStyle = rgba(color, alpha);
    ctx.fill();

    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();

    const lengths = [];
    let total = 0;
    for (let i = 1; i < points.length; i++) {
      const length = Math.hypot(points[i][0] - points[i - 1][0], points[i][1] - points[i - 1][1]);
      lengths.push(length); total += length;
    }
    let remaining = clamp(progress) * total;
    for (let i = 0; i < lengths.length; i++) {
      if (remaining <= lengths[i] || i === lengths.length - 1) {
        const q = lengths[i] ? remaining / lengths[i] : 0;
        return [points[i][0] + (points[i + 1][0] - points[i][0]) * q,
          points[i][1] + (points[i + 1][1] - points[i][1]) * q];
      }
      remaining -= lengths[i];
    }
    return points[0];
  }

  function signal(points, color, phase = 0, speed = 0.19, alpha = 0.85) {
    line(points, rgba(color, 0.18 * alpha), 1.1);
    const progress = ((time * speed + phase) % 1 + 1) % 1;
    const point = pointAlongPolyline(points, progress);
    for (let j = 3; j >= 1; j--) {
      const behind = pointAlongPolyline(points, Math.max(0, progress - j * 0.017));
      dot(behind[0], behind[1], color, 1.1, alpha * 0.07 * (4 - j));
    }
    dot(point[0], point[1], color, 2.05, alpha);
  }

  function wafer(cx, cy, color, opacity, depth = 36, thickness = 8, width = 268) {
    const left = cx - width / 2, right = cx + width / 2;
    const top = cy - depth / 2, bottom = cy + depth / 2;
    const points = [[left + 20, top], [right, top + 12], [right - 20, bottom], [left, bottom - 12]];
    ctx.save();
    ctx.globalAlpha *= opacity;
    const side = ctx.createLinearGradient(0, top, 0, bottom + thickness);
    side.addColorStop(0, rgba(color, 0.09));
    side.addColorStop(1, 'rgba(7,10,14,0.94)');
    polygon([points[1], points[2], [points[2][0], points[2][1] + thickness],
      [points[1][0], points[1][1] + thickness]], side, rgba(color, 0.18));
    polygon([points[2], points[3], [points[3][0], points[3][1] + thickness],
      [points[2][0], points[2][1] + thickness]], 'rgba(12,16,23,0.92)', rgba(color, 0.25));
    const topFill = ctx.createLinearGradient(left, top, right, bottom);
    topFill.addColorStop(0, rgba(mix(color, [30, 37, 49], 0.74), 0.80));
    topFill.addColorStop(0.45, 'rgba(16,21,30,0.90)');
    topFill.addColorStop(1, rgba(mix(color, [24, 29, 39], 0.88), 0.85));
    roundedPolygon(points, 6);
    ctx.fillStyle = topFill;
    ctx.fill();
    ctx.strokeStyle = rgba(color, 0.34);
    ctx.lineWidth = 0.9;
    ctx.stroke();
    line([[left + 25, top + 1], [right - 4, top + 12]], rgba(color, 0.38), 0.85);
    line([[left + 7, bottom - 10 + thickness], [right - 25, bottom + thickness]], rgba(color, 0.13), 0.65);
    ctx.restore();
  }

  function chip(cx, cy, color, decoder, opacity, phase) {
    const width = 268, depth = 114, thickness = 12;
    const left = cx - width / 2, right = cx + width / 2;
    const top = cy - depth / 2, bottom = cy + depth / 2;
    const surface = [[left + 20, top], [right, top + 15], [right - 20, bottom], [left, bottom - 15]];
    ctx.save();
    ctx.globalAlpha *= opacity;

    // Only the tiny physical object carries a shadow; never blur the canvas.
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.72)';
    ctx.shadowBlur = 24;
    ctx.shadowOffsetY = 18;
    polygon(surface.map(p => [p[0], p[1] + 8]), 'rgba(0,0,0,0.40)');
    ctx.restore();

    const face = ctx.createLinearGradient(left, bottom - 20, right, bottom + thickness);
    face.addColorStop(0, rgba(mix(color, [12, 17, 25], 0.75), 0.90));
    face.addColorStop(0.46, 'rgba(11,15,22,0.97)');
    face.addColorStop(1, rgba(color, 0.16));
    polygon([surface[2], surface[3], [surface[3][0], surface[3][1] + thickness],
      [surface[2][0], surface[2][1] + thickness]], face, rgba(color, 0.28), 0.9);
    polygon([surface[1], surface[2], [surface[2][0], surface[2][1] + thickness],
      [surface[1][0], surface[1][1] + thickness]], 'rgba(18,22,28,0.94)', rgba(color, 0.22), 0.9);

    const glass = ctx.createLinearGradient(left, top, right, bottom);
    glass.addColorStop(0, rgba(mix(color, [38, 47, 58], 0.68), 0.98));
    glass.addColorStop(0.20, 'rgba(23,29,39,0.96)');
    glass.addColorStop(0.65, 'rgba(15,20,29,0.98)');
    glass.addColorStop(1, rgba(mix(color, [24, 29, 37], 0.80), 0.95));
    roundedPolygon(surface, 8);
    ctx.fillStyle = glass;
    ctx.fill();
    ctx.lineWidth = 1.1;
    ctx.strokeStyle = rgba(color, 0.53);
    ctx.stroke();

    // Micro traces and contact pads remain geometry, never illegible tiny text.
    ctx.save();
    roundedPolygon(surface, 8);
    ctx.clip();
    for (let j = 0; j < 8; j++) {
      const px = left + 46 + j * 22;
      line([[px, top + 8], [px + 7, top + 20], [px + 20, top + 21]], rgba(color, 0.085), 0.6);
      line([[px - 4, bottom - 6], [px, bottom - 18], [px + 13, bottom - 18]], rgba(color, 0.065), 0.6);
    }
    for (let j = 0; j < 9; j++) {
      ctx.fillStyle = rgba(color, 0.15 + 0.04 * Math.sin(j * 0.7));
      ctx.fillRect(left + 33 + j * 21, bottom - 4 + (j * 0.77), 8, 1.5);
    }
    const sweep = 0.5 + 0.5 * Math.sin(time * 0.32 + phase);
    const sx = left - 100 + sweep * 450;
    const sheen = ctx.createLinearGradient(sx - 50, top, sx + 70, bottom);
    sheen.addColorStop(0, 'rgba(255,255,255,0)');
    sheen.addColorStop(0.5, 'rgba(225,240,255,0.055)');
    sheen.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sheen;
    ctx.fillRect(left, top, width, depth);
    ctx.restore();

    line([[left + 27, top + 1], [right - 8, top + 14]], rgba(pale, 0.42), 0.9);
    line([[left + 6, bottom - 13 + thickness], [right - 25, bottom + thickness - 1]], rgba(color, 0.23), 1);

    const rows = decoder
      ? [{ text: 'Feed-forward', y: cy - 26, c: gold },
        { text: 'Cross-attention', y: cy, c: mix(blue, gold, 0.25) },
        { text: 'Masked self-attn', y: cy + 26, c: gold }]
      : [{ text: 'Feed-forward', y: cy - 17, c: blue },
        { text: 'Self-attention', y: cy + 17, c: blue }];
    const railX = left + 43;
    for (let j = 0; j < rows.length; j++) {
      const row = rows[j];
      const pulse = 0.60 + 0.19 * Math.sin(time * 1.45 + phase - j * 0.60);
      if (j < rows.length - 1) {
        line([[left + 62, (row.y + rows[j + 1].y) / 2],
          [right - 34, (row.y + rows[j + 1].y) / 2]], rgba(color, 0.08), 0.65);
      }
      label(row.text, cx + 12, row.y, rgba(pale, decoder && j === 1 ? 0.97 : 0.88), 18, decoder && j === 1 ? 550 : 450);
      dot(railX, row.y, row.c, 2.1, pulse);
    }
    line([[railX, rows[rows.length - 1].y], [railX, rows[0].y]], rgba(color, 0.25), 1);
    arrow(railX, rows[0].y - 7, -Math.PI / 2, rgba(color, 0.62), 3.2);
    if (decoder) {
      line([[left + 10, cy], [railX - 7, cy]], rgba(blue, 0.56), 1.2);
      dot(left + 10, cy, blue, 2.1, 0.82);
    }
    ctx.restore();
  }

  function tokenRow(cx, y, labels, color, firstWide) {
    const widths = labels.map((_, i) => firstWide && i === 0 ? 60 : 42);
    const total = widths.reduce((sum, w) => sum + w, 0) + (labels.length - 1) * 7;
    let x = cx - total / 2;
    for (let i = 0; i < labels.length; i++) {
      const w = widths[i];
      const brightness = 0.12 + 0.035 * Math.sin(time * 1.4 - i * 0.65);
      roundRect(x, y, w, 32, 8);
      ctx.fillStyle = rgba(color, brightness);
      ctx.fill();
      ctx.strokeStyle = rgba(color, 0.28);
      ctx.lineWidth = 0.9;
      ctx.stroke();
      label(labels[i], x + w / 2, y + 16, rgba(color, 0.93), 18, 450);
      x += w + 7;
    }
  }

  ctx.save();
  ctx.beginPath();
  ctx.rect(640, 130, 870, 565);
  ctx.clip();
  ctx.globalAlpha *= reveal;

  // Fixed seed and closed-form motion make the frame independent of playback history.
  let seed = 421337;
  function random() {
    seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
    return seed / 4294967296;
  }
  for (let i = 0; i < 25; i++) {
    const baseX = 680 + random() * 795;
    const baseY = 180 + random() * 440;
    const phase = random() * Math.PI * 2;
    const radius = 0.55 + random() * 0.8;
    const alpha = 0.05 + random() * 0.09;
    const color = baseX < 1060 ? blue : gold;
    ctx.fillStyle = rgba(color, alpha);
    ctx.beginPath();
    ctx.arc(baseX + Math.sin(time * 0.13 + phase) * 4,
      baseY + Math.cos(time * 0.16 + phase) * 3, radius, 0, Math.PI * 2);
    ctx.fill();
  }
  glow(ex, 440, 230, blue, 0.045);
  glow(dx, 440, 230, gold, 0.040);

  label('ENCODER', ex - 25, 153, rgba(blue, 0.91), 20, 550);
  label('× N', ex + 78, 153, rgba(pale, 0.43), 18, 400);
  label('DECODER', dx - 26, 153, rgba(gold, 0.94), 20, 550);
  label('× N', dx + 80, 153, rgba(pale, 0.43), 18, 400);

  // Residual block-to-block flow travels upwards in both columns.
  for (const [cx, color, shift] of [[ex, blue, 0], [dx, gold, decoderShift]]) {
    signal([[cx, 640], [cx, bottomY + 63 + shift]], color, cx === ex ? 0.08 : 0.38, 0.27, 0.80);
    arrow(cx, bottomY + 65 + shift, -Math.PI / 2, rgba(color, 0.58));
    signal([[cx, bottomY - 58 + shift], [cx, midY + 36 + shift]], color, 0.41, 0.28, 0.62);
    signal([[cx, midY - 30 + shift], [cx, topY + 67 + shift]], color, 0.17, 0.26, 0.66);
  }

  // Only the final encoder representation becomes memory; every decoder layer reads it.
  const memoryTop = 202;
  const memoryRoute = [[ex, topY - 58], [ex, memoryTop], [busX, memoryTop], [busX, bottomY + decoderShift]];
  signal(memoryRoute, blue, 0.09, 0.125, 0.86);
  label('K / V', busX, 177, rgba(blue, 0.93), 19, 550);
  for (const [cy, phase, a] of [[topY + decoderShift, 0.23, 0.95],
    [midY + decoderShift, 0.56, 0.34], [bottomY + decoderShift, 0.78, 0.73]]) {
    const branch = [[busX, cy], [dx - 124, cy]];
    signal(branch, blue, phase, 0.24, a);
    dot(busX, cy, blue, 2, a * 0.65);
    arrow(dx - 128, cy, 0, rgba(blue, a * 0.70), 3.6);
  }

  // A few thin, repeating layers suggest depth without turning the view into a diagram panel.
  for (const [cx, color, shift] of [[ex, blue, 0], [dx, gold, decoderShift]]) {
    wafer(cx + 2, midY + 14 + shift, color, 0.43, 35, 8, 264);
    wafer(cx, midY - 4 + shift, color, 0.57, 35, 8, 268);
    label('···', cx, midY - 5 + shift, rgba(color, 0.55), 23, 450);
  }

  chip(ex, bottomY, blue, false, 0.76, 0.7);
  chip(dx, bottomY + decoderShift, gold, true, 0.80, 1.1);
  chip(ex, topY, blue, false, 1.0, 0.0);
  chip(dx, topY + decoderShift, gold, true, 1.0, 0.4);

  // A query is made by the decoder's masked self-attention, not by the encoder.
  // The subtle inner rail already rises from Masked self -> Cross -> FFN.
  label('Q', dx - 99, topY + decoderShift + 13, rgba(gold, 0.86), 18, 550);

  const headY = 197;
  signal([[dx, topY - 58 + decoderShift], [dx, headY + 18]], gold, 0.52, 0.24, 0.82);
  arrow(dx, headY + 21, -Math.PI / 2, rgba(gold, 0.62), 3.8);
  roundRect(dx - 100, headY - 17, 200, 34, 10);
  ctx.fillStyle = 'rgba(24,24,28,0.93)';
  ctx.fill();
  ctx.strokeStyle = rgba(gold, 0.27);
  ctx.lineWidth = 0.9;
  ctx.stroke();
  label('Linear · Softmax', dx, headY, rgba(gold, 0.89), 18, 500);
  signal([[dx + 101, headY], [1442, headY]], gold, 0.36, 0.29, 0.84);
  arrow(1434, headY, 0, rgba(gold, 0.65), 3.6);
  glow(1458, headY, 29, gold, 0.12 + 0.025 * Math.sin(time * 1.5));
  roundRect(1442, headY - 17, 41, 34, 9);
  ctx.fillStyle = rgba(gold, 0.15);
  ctx.fill();
  ctx.strokeStyle = rgba(gold, 0.46);
  ctx.stroke();
  label('yₜ', 1462.5, headY, rgba(gold, 0.98), 20, 550);

  tokenRow(ex, 638, ['x₁', 'x₂', 'x₃'], blue, false);
  tokenRow(dx, 638, ['BOS', 'y₁', 'y₂'], gold, true);
  label('源序列', ex, 684, rgba(pale, 0.56), 18, 400);
  label('目标序列 · 右移', dx, 684, rgba(pale, 0.59), 18, 400);

  ctx.restore();
}

function frameToScene(f){const s=f/30;return s<10?0:s<19?1:s<28?2:3}
function scene(i,t){g.save();editorial(i,t);if(i===0)attention(t);else if(i===1)feedforward(t);else if(i===2)block(t);else drawOverview(g,t);g.restore()}
const scrub=document.getElementById('scrub'),clock=document.getElementById('clock'),select=document.getElementById('chapters'),play=document.getElementById('play');
let frame=0,playing=false,origin=0,raf=0,previousDraw=-1;
function render(f){
 frame=clamp(Math.round(f),0,1079);let i=frameToScene(frame),t=frame/30-sections[i];
 g.setTransform(canvas.width/W,0,0,canvas.height/H,0,0);
 bg(scenes[i].accent,t);header(i);
 const transition=.50,fade=phase(t,0,transition);
 if(i>0&&t<transition){g.save();g.globalAlpha=1-fade;g.translate(-26*fade,0);scene(i-1,sections[i]-sections[i-1]);g.restore();g.save();g.globalAlpha=fade;g.translate(30*(1-fade),0);scene(i,t);g.restore()}else scene(i,t);
 footer(i,t);scrub.value=frame;clock.textContent='0:'+String(Math.floor(frame/30)).padStart(2,'0')+' / 0:36';select.value=String(sections[i]*30);previousDraw=frame;
}
function tick(now){if(!playing)return;const target=Math.floor((now-origin)*.03);if(target>=1080){render(1079);setPlay(false);return}if(target!==previousDraw)render(target);raf=requestAnimationFrame(tick)}
function setPlay(on){playing=on;cancelAnimationFrame(raf);play.textContent=on?'暂停':'播放';if(on){if(frame>=1079)frame=0;origin=performance.now()-frame/0.03;raf=requestAnimationFrame(tick)}}
function setSize(){const dpr=exporting?1:Math.min(1.7,window.devicePixelRatio||1);const w=Math.max(1,Math.round(canvas.getBoundingClientRect().width*dpr));canvas.width=w;canvas.height=Math.round(w*9/16);render(frame)}
window.seekFrame=(n)=>{setPlay(false);render(n);return frame};
scrub.oninput=()=>window.seekFrame(+scrub.value);
select.onchange=()=>{const was=playing;window.seekFrame(+select.value+21);if(was)setPlay(true)};
play.onclick=()=>setPlay(!playing);document.getElementById('full').onclick=async()=>{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()};
document.addEventListener('keydown',e=>{if(e.target.matches('input,select,button'))return;if(e.code==='Space'){e.preventDefault();setPlay(!playing)}if(e.code==='ArrowRight')window.seekFrame(frame+30);if(e.code==='ArrowLeft')window.seekFrame(frame-30)});
window.addEventListener('resize',setSize);setSize();if(!exporting&&!matchMedia('(prefers-reduced-motion: reduce)').matches)setPlay(true);
</script></body></html>
